services:
  - type: web
    name: ai-prospect-discovery
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: REQUEST_TIMEOUT_SECONDS
        value: 30
      - key: PHONE_DEFAULT_REGION
        value: US
      - key: SEARCH_CACHE_ENABLED
        value: true
      - key: SEARCH_CACHE_DIR
        value: .cache/search
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
